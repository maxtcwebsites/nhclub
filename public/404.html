<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AClub</title>
    <script>
      // Someone opened an old-style link like /nhclub/family. Send them to
      // the same page in the app (/nhclub/#/family).
      (function () {
        // The site lives in a sub-folder on <user>.github.io/<repo>/ and at
        // the root on a custom domain. (Rename 'nhclub' if the repo changes.)
        var parts = location.pathname.split('/').filter(Boolean);
        var inProjectFolder = /\.github\.io$/.test(location.hostname) || parts[0] === 'nhclub';
        var base = inProjectFolder && parts.length ? '/' + parts.shift() + '/' : '/';
        location.replace(base + '#/' + parts.join('/'));
      })();
    </script>
  </head>
  <body>
    <p><a href="./">Ir al portal de AClub / Go to the AClub portal</a></p>
  </body>
</html>
